<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="agent-os-token" content="{{TOKEN}}">
  <title>Agent OS Executive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Agent OS <span>Executive</span></div>
    <span class="spacer"></span>
    <div id="provider-errors" class="muted"></div>
  </header>

  <div id="busy" class="busy hidden" role="status" aria-live="polite"><span class="spinner"></span><span id="busy-text">Loading…</span></div>

  <main class="executive-container">
    <div class="tabs-container">
      <div class="tabs" role="tablist">
        <button id="tab-work" class="tab on" role="tab" aria-selected="true">Work</button>
        <button id="tab-personal" class="tab" role="tab" aria-selected="false">Personal</button>
      </div>

      <div id="items-panel" class="items-panel">
        <div id="work-tab" class="tab-content on">
          <div id="work-items" class="items-list"></div>
        </div>
        <div id="personal-tab" class="tab-content">
          <div id="personal-items" class="items-list"></div>
        </div>
      </div>
    </div>

    <div class="chat-container">
      <div class="chat-panel">
        <div id="chat-log" class="chat-log"></div>
        <div class="chat-compose">
          <input id="chat-input" placeholder="Message the model" autocomplete="off">
          <button id="chat-send" class="primary">Send</button>
        </div>
      </div>
    </div>

    <div id="pending-previews" class="pending-previews"></div>
  </main>

  <style>
    .executive-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      height: 100vh;
      overflow: hidden;
    }
    .tabs-container {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .items-panel {
      flex: 1;
      overflow: hidden;
    }
    .tab-content {
      display: none;
      height: 100%;
      overflow-y: auto;
    }
    .tab-content.on {
      display: block;
    }
    .items-list {
      display: grid;
      gap: 8px;
      padding: 8px;
    }
    .item-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      display: grid;
      gap: 6px;
      background: var(--panel);
    }
    .item-title {
      font-weight: 600;
      word-break: break-word;
    }
    .item-why {
      font-size: 13px;
      color: var(--muted);
    }
    .item-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 12px;
    }
    .item-options {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .item-options button {
      padding: 4px 10px;
      font-size: 12px;
    }
    .option-consequential::after {
      content: " ⚠";
    }
    .chat-container {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-left: 1px solid var(--line);
      padding-left: 16px;
    }
    .chat-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }
    .chat-log {
      flex: 1;
      overflow-y: auto;
      display: grid;
      gap: 8px;
      padding: 8px 0;
      min-height: 0;
      max-height: none;
    }
    .chat-compose {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }
    .chat-compose input {
      flex: 1;
    }
    .pending-previews {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: grid;
      gap: 8px;
      max-width: 320px;
      z-index: 10;
    }
    .preview-card {
      border: 2px solid var(--warn);
      border-radius: 8px;
      padding: 12px;
      background: var(--panel);
      display: grid;
      gap: 8px;
    }
    .preview-title {
      font-weight: 600;
      color: var(--warn);
    }
    .preview-content {
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .preview-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .preview-actions button {
      flex: 1;
      padding: 6px 10px;
      font-size: 12px;
    }
    @media (max-width: 1024px) {
      .executive-container {
        grid-template-columns: 1fr;
      }
      .chat-container {
        border-left: none;
        border-top: 1px solid var(--line);
        padding-left: 0;
        padding-top: 16px;
      }
    }
    .mail-cleanup-table { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 13px; }
    .mail-cleanup-table th, .mail-cleanup-table td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #ddd; vertical-align: top; }
    .mail-cleanup-account { font-weight: 600; margin-top: 8px; }
    .mail-cleanup-filtered, .mail-filtered-counts { margin-top: 6px; font-size: 13px; }
    .mail-filtered details { margin-top: 6px; }
    .mail-filtered li { font-size: 13px; }
  </style>

  <script src="executive.js"></script>
</body>
</html>
