name: Agent OS maintenance

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out Ingester Engine
        # Private sibling repository, read through a read-only deploy key scoped
        # to ingester-engine (secret INGESTER_ENGINE_DEPLOY_KEY).
        uses: actions/checkout@v4
        with:
          repository: unwit1/ingester-engine
          path: _deps/ingester-engine
          ssh-key: ${{ secrets.INGESTER_ENGINE_DEPLOY_KEY }}
      - name: Install Ingester Engine
        run: python -m pip install -e _deps/ingester-engine
      - name: Rebuild derived index and report candidate reviews
        run: python agent.py maintenance --event scheduled
      - name: Run Agent OS tests
        run: python -m unittest discover -s tests -v
