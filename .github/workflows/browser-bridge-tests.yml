name: Browser bridge tests

on:
  push:
    branches: [main]
    paths:
      - "src/agent_os/browser_bridge.py"
      - "src/agent_os/browser_bridge_server.py"
      - "src/agent_os/cli.py"
      - "tests/test_browser_bridge.py"
      - ".github/workflows/browser-bridge-tests.yml"
  pull_request:
    paths:
      - "src/agent_os/browser_bridge.py"
      - "src/agent_os/browser_bridge_server.py"
      - "src/agent_os/cli.py"
      - "tests/test_browser_bridge.py"
      - ".github/workflows/browser-bridge-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Run browser bridge tests
        run: python -m pytest -q tests/test_browser_bridge.py
