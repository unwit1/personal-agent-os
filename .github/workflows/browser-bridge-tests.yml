name: Browser bridge tests

on:
  push:
    branches: [main]
    paths:
      - "src/agent_os/browser_bridge.py"
      - "src/agent_os/browser_bridge_server.py"
      - "src/agent_os/browser_control.py"
      - "src/agent_os/creator_profiles.py"
      - "src/agent_os/watching.py"
      - "src/agent_os/mcp_server.py"
      - "src/agent_os/cli.py"
      - "tests/test_browser_bridge.py"
      - ".github/workflows/browser-bridge-tests.yml"
  pull_request:
    paths:
      - "src/agent_os/browser_bridge.py"
      - "src/agent_os/browser_bridge_server.py"
      - "src/agent_os/browser_control.py"
      - "src/agent_os/creator_profiles.py"
      - "src/agent_os/watching.py"
      - "src/agent_os/mcp_server.py"
      - "src/agent_os/cli.py"
      - "tests/test_browser_bridge.py"
      - ".github/workflows/browser-bridge-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Run browser bridge tests
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_browser_bridge.py 2>&1 | tee browser-bridge-test-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"
      - name: Upload browser bridge test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-bridge-test-output
          path: browser-bridge-test-output.txt
          if-no-files-found: ignore
          retention-days: 7
