name: Skyrim Knowledge Validation

on:
  push:
    paths:
      - "knowledge/libraries/skyrim-modding/**"
      - "tools/knowledge/**"
      - ".github/workflows/skyrim-knowledge-validation.yml"
  pull_request:
    paths:
      - "knowledge/libraries/skyrim-modding/**"
      - "tools/knowledge/**"
      - ".github/workflows/skyrim-knowledge-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate Skyrim knowledge and automation schemas
        run: python tools/knowledge/validate_skyrim_knowledge.py
