name: Publish Agent OS userscript

on:
  push:
    branches: [main]
    paths:
      - "browser/userscripts/agent-os-universal-capture.user.js"
      - ".github/workflows/publish-agent-os-userscript.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "agent-os-userscript-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build public userscript artifact
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import html
          import os
          import re
          from pathlib import Path

          source_path = Path("browser/userscripts/agent-os-universal-capture.user.js")
          source = source_path.read_text(encoding="utf-8")

          match = re.search(r"(?m)^// @version\s+(\S+)\s*$", source)
          if not match:
              raise SystemExit("userscript @version metadata is missing")

          base_version = match.group(1)
          published_version = f"{base_version}.{os.environ['GITHUB_RUN_NUMBER']}"

          source = re.sub(
              r"(?m)^// @version\s+\S+\s*$",
              f"// @version      {published_version}",
              source,
              count=1,
          )
          source = re.sub(
              r'var VERSION = "[^"]+";',
              f'var VERSION = "{published_version}";',
              source,
              count=1,
          )

          out = Path("_site")
          out.mkdir(exist_ok=True)
          (out / "agent-os-universal-capture.user.js").write_text(source, encoding="utf-8")
          (out / "version.txt").write_text(published_version + "\n", encoding="utf-8")

          install_url = "https://unwit1.github.io/personal-agent-os/agent-os-universal-capture.user.js"
          page = f"""<!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Agent OS Universal Capture</title>
          <style>
          body{{font:16px system-ui,sans-serif;max-width:760px;margin:60px auto;padding:0 20px;line-height:1.55}}
          a.button{{display:inline-block;padding:12px 16px;border-radius:8px;background:#20242b;color:white;text-decoration:none;font-weight:700}}
          code{{background:#f3f3f3;padding:2px 5px;border-radius:4px}}
          </style>
          <h1>Agent OS Universal Capture</h1>
          <p>Published version: <strong>{html.escape(published_version)}</strong></p>
          <p><a class="button" href="{html.escape(install_url)}">Install / Update in Tampermonkey</a></p>
          <p>This public site contains only the distributable userscript. Agent OS itself remains private.</p>
          </html>"""
          (out / "index.html").write_text(page, encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
