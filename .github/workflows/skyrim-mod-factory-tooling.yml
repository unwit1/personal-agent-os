name: Skyrim Mod Factory Tooling

on:
  push:
    paths:
      - "tools/skyrim_mod_factory/**"
      - "schemas/skyrim-*.schema.json"
      - "knowledge/libraries/skyrim-modding/automation/**"
      - ".github/workflows/skyrim-mod-factory-tooling.yml"
  pull_request:
    paths:
      - "tools/skyrim_mod_factory/**"
      - "schemas/skyrim-*.schema.json"
      - "knowledge/libraries/skyrim-modding/automation/**"
      - ".github/workflows/skyrim-mod-factory-tooling.yml"

permissions:
  contents: read

jobs:
  standard-library-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Mod Factory Python
        run: python -m compileall -q tools/skyrim_mod_factory tools/knowledge
      - name: Run standard-library unit tests
        run: python -m unittest discover -s tools/skyrim_mod_factory/tests -p "test_*.py"
