name: Skyrim Mod Factory Tooling

on:
  push:
    paths:
      - "tools/skyrim_mod_factory/**"
      - "schemas/skyrim-*.schema.json"
      - "knowledge/libraries/skyrim-modding/automation/**"
      - ".github/workflows/skyrim-mod-factory-tooling.yml"
  pull_request:
    paths:
      - "tools/skyrim_mod_factory/**"
      - "schemas/skyrim-*.schema.json"
      - "knowledge/libraries/skyrim-modding/automation/**"
      - ".github/workflows/skyrim-mod-factory-tooling.yml"

permissions:
  contents: read

jobs:
  standard-library-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml
      - name: Compile Mod Factory Python
        run: python -m compileall -q tools/skyrim_mod_factory tools/knowledge
      - name: Validate adapter manifests
        run: python tools/skyrim_mod_factory/validate_adapters.py knowledge/libraries/skyrim-modding/automation/adapters
      - name: Run standard-library unit tests
        run: python -m unittest discover -s tools/skyrim_mod_factory/tests -p "test_*.py"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore Mutagen semantic oracle
        run: dotnet restore tools/skyrim_mod_factory/mutagen_semantic_oracle/MutagenSemanticOracle.csproj
      - name: Build Mutagen semantic oracle
        run: dotnet build tools/skyrim_mod_factory/mutagen_semantic_oracle/MutagenSemanticOracle.csproj --configuration Release --no-restore --warnaserror
