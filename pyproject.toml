[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator-os"
version = "0.1.0"
description = "Provider-neutral orchestration of coding agents across Git repositories"
requires-python = ">=3.11"
# keyring: secrets:// references for provider keys. jsonschema: run/record validation.
dependencies = ["keyring>=25,<26", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
# pytest only for the Windows-sandbox plugin tests.
dev = ["pytest>=8"]
# Offline improvement lab (orchestrator_os.lab_harness2). Pinned commit; Python 3.12+.
harness2 = ["harness2 @ git+https://github.com/google-research/harness2@6868817518876de8fd170c6a8354daca273b6191 ; python_version >= '3.12'"]

[project.scripts]
orchestrator = "orchestrator_os.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orchestrator_os = ["gui/*", "defaults/*.json", "adapters/win_sandbox/*.py"]
