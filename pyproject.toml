[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agent-os"
version = "0.1.0"
description = "A Git-backed, vendor-neutral context and memory layer for coding agents"
requires-python = ">=3.11"
dependencies = ["keyring>=25,<26"]

[project.optional-dependencies]
attachments = [
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=11,<13",
  "pytesseract>=0.3.13,<1",
  "PyMuPDF>=1.25,<2",
  "pillow-heif>=0.22,<2",
  "mutagen>=1.47,<2",
]

[project.scripts]
agent-os = "agent_os.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
