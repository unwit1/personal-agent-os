[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agent-os"
version = "0.1.0"
description = "A Git-backed, vendor-neutral context and memory layer for coding agents"
requires-python = ">=3.11"
dependencies = ["keyring>=25,<26"]

[project.scripts]
agent-os = "agent_os.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
